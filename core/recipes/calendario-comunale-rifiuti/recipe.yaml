id: calendario-comunale-rifiuti
tier: starter
license: MIT
versione: "1.0.0"
created_at: "2026-06-10T00:00:00Z"
updated_at: "2026-06-10T00:00:00Z"
novita_changelog: "v1.0.0 — calendario raccolta differenziata per-comune: frazioni, motore ricorrenze (settimanale/quindicinale/mensile/lista date) con eccezioni, promemoria OS, import PDF assistito + regolamento 'dove butto X'."
nome_visualizzato: "Calendario Rifiuti Comunale"
descrizione_breve: "Sai sempre quando esporre umido, plastica, carta e vetro nel tuo comune, con promemoria sul PC"
descrizione_estesa: >
  Costruisci il calendario della raccolta differenziata del TUO comune e non
  sbagli più giorno. Imposti le frazioni (umido, indifferenziato, carta, plastica,
  vetro, verde, RAEE...) con le loro ricorrenze — settimanali, a settimane alterne,
  mensili o a date fisse — e l'app calcola da sola le prossime raccolte e ti manda
  un promemoria sul computer. Puoi partire da zero a mano, oppure farti aiutare
  importando il PDF del calendario comunale. C'è anche un "dove butto X?" per
  ricordarti in quale frazione va ogni materiale. Tutto resta sul tuo PC: nessun
  dato esce, nessun account.
