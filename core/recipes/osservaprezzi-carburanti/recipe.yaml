versione: "1.1.0"
created_at: "2026-05-24T00:00:00Z"
updated_at: "2026-06-05T00:00:00Z"
novita_changelog: "v1.1.0 — geolocalizzazione automatica del dispositivo + tab «Vicino a me» come primo. v1.0.0 — moduli services + geo (Haversine + nearest + bounding box) + preferiti con alert prezzo + rifornimenti + consumo medio L/100km + log refresh MIMIT (Q3-2028 LIVE, 41 test, cov 99%)."
nome_visualizzato: "Osservaprezzi Carburanti"
descrizione_breve: "I prezzi del tuo distributore preferito, freschi dal MIMIT, prima di partire"
descrizione_estesa: >
  Consultazione locale dei prezzi carburanti aggiornati dal registro
  pubblico MIMIT. Cerchi per CAP, salvi i preferiti, vedi lo storico.
  Niente API key, nessun dato tuo esce dal PC — è solo download di
  CSV pubblici aggiornati ogni giorno.
