# Bundle "Studio Medico" - Catalogo €69/mese
#
# Aggregato 3 ricette verticali per medici (MMG/specialisti/studio piccolo).
#
# Tag git per ogni componente:
# - recipe-atheneo-medico-cds-v1.0.0 (Q3-2027 anticipato)
# - recipe-vault-clienti-v1.0.0
# - recipe-agenda-studio-v1.0.0
#
# Riferimento knowledge: givegroup-knowledge/give-engine/BUNDLE-STUDIO-MEDICO.md
# Riferimento roadmap: givegroup-knowledge/give-engine/ROADMAP-Q3-2027.md (W10)

id: studio-medico
name: "Studio Medico"
tier: catalog
prezzo_mensile_eur: 69
prezzo_annuale_eur: 690
sconto_annuale_pct: 17
created_at: "2026-05-29T00:00:00Z"

descrizione_breve: >
  Atheneo Medico CDSS (linee guida ISS + AIFA) + vault clienti cifrato +
  agenda appuntamenti. 3 ricette verticali, segreto professionale by-design,
  GDPR art.9 by-design.

target_audience: >
  Medici MMG (medicina generale) / specialisti studio singolo o piccolo
  associato. Mercato addressable italiano: ~250k medici iscritti FNOMCeO.

componenti:
  - id: atheneo-medico-cds
    versione_min: "1.0.0"
    ruolo: "RAG verticale ISS/PNLG/AIFA + cartelle pseudonimizzate + audit accessi (NEW Q3-2027)"
    crypto_dep: true

  - id: vault-clienti
    versione_min: "1.0.0"
    ruolo: "Anagrafica pazienti cifrata (segreto professionale art.622 c.p.)"
    crypto_dep: true

  - id: agenda-studio
    versione_min: "1.0.0"
    ruolo: "Appuntamenti + scadenze visite + reminder"
    crypto_dep: true
    companion_di: atheneo-medico-cds

caratteristiche_chiave:
  - "Master password unica per tutte e 3 le ricette"
  - "AES-256-GCM at-rest tramite core/shared/crypto/ v0.1.0"
  - "Skill firmate Gi.Ve: PNLG-ISS + AIFA + farmacopea + normativa medica"
  - "Citation strict obbligatoria"
  - "Cartelle pazienti pseudonimizzate (NO nome reale, NO CF)"
  - "Audit accessi cartella (art.622 c.p. + GDPR art.9)"
  - "Disclaimer hard CDSS in ogni pagina"
  - "Zero cloud, zero endpoint Gi.Ve (Punto 14)"

gdpr_value_props:
  - "Tu medico = titolare unico (segreto professionale)"
  - "Paziente = contitolare con consenso GDPR art.9"
  - "Niente DPA con Gi.Ve"
  - "Cartelle cifrate at-rest art.32 GDPR + art.622 c.p."

cosa_NON_fa:
  - "Non sostituisce visita medica, diagnosi o terapia"
  - "Non emette ricette o prescrizioni"
  - "Non si collega a SISS regionale / Tessera Sanitaria"
  - "Non sostituisce cartella clinica elettronica multi-utente"
  - "Non multi-utente LAN (Atheneo Pro processo dev dedicato separato, Punto 25)"
