# Bundle "Studio Solo" — Catalogo €49/mese
#
# Aggregato 3 ricette per professionista solo studio piccolo (avvocato/
# commercialista/notaio/tecnico). Tutte cifrate at-rest, master password
# unica, italiano puro, zero endpoint Gi.Ve.
#
# Tag git per ogni componente:
# - recipe-vault-clienti-v1.0.0
# - recipe-agenda-studio-v1.0.0
# - recipe-atheneo-light-v0.3.0 (già LIVE Q2 2026)
#
# Riferimento knowledge: givegroup-knowledge/give-engine/BUNDLE-STUDIO-SOLO.md
# Riferimento roadmap: givegroup-knowledge/give-engine/ROADMAP-Q3-2026.md (W39)

id: studio-solo
name: "Studio Solo"
tier: catalog
prezzo_mensile_eur: 49
created_at: "2026-05-29T00:00:00Z"

descrizione_breve: >
  Vault clienti cifrato, agenda con scadenze, ricerca semantica
  documentale: il tuo studio professionale in 1 master password.

target_audience: >
  Avvocato solo, commercialista solo, notaio singolo, tecnico
  studio piccolo (1 professionista, max 3 collaboratori).

componenti:
  - id: vault-clienti
    versione_min: "1.0.0"
    ruolo: "Anagrafica clienti cifrata + documenti + audit log"
    crypto_dep: true

  - id: agenda-studio
    versione_min: "1.0.0"
    ruolo: "Appuntamenti + scadenze + reminder + iCal export"
    crypto_dep: true
    companion_di: vault-clienti

  - id: atheneo-light
    versione_min: "0.3.0"
    ruolo: "Ricerca semantica documenti + sintesi AI opt-in"
    crypto_dep: false

caratteristiche_chiave:
  - "Master password unica per tutte e 3 le ricette"
  - "AES-256-GCM at-rest tramite core/shared/crypto/ v0.1.0"
  - "Audit log immutabile accessi (vault + agenda)"
  - "Ricerca semantica documenti (atheneo-light)"
  - "Export CSV commercialista (vault deducibili)"
  - "Export iCal calendario (agenda → Apple/Google/Outlook)"
  - "Zero cloud, zero endpoint Gi.Ve (Punto 14)"
  - "Italiano puro (Punto 18)"

gdpr_value_props:
  - "Tu professionista = titolare unico"
  - "Niente DPA con Gi.Ve"
  - "Right-to-erasure cliente con audit conservato 10 anni"
  - "Cifratura at-rest art. 32 GDPR"
  - "Auto-lock 30 min default (15 min ricette art. 9 GDPR)"

cosa_NON_fa:
  - "Non gestisce fatturazione (companion archivio-fe-sdi Q4)"
  - "Non sostituisce commercialista/avvocato"
  - "Non si collega a PEC/Polisweb/AdE"
  - "Non multi-utente LAN (Atheneo Pro per studio multi-collaboratore)"
